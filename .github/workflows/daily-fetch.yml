name: Daily Binance fetch

on:
  # UTC. Daily candles close at 00:00 UTC (08:00 Beijing). Each run collects the last 3 completed UTC days
  # and re-collects dates still "partial" (official archive not yet published: spot ~02-04 UTC, futures ~08-15 UTC).
  # GitHub may start scheduled runs late, so several slots are used; off-the-hour minutes reduce queueing.
  schedule:
    - cron: "7 0 * * *"    # 08:07 Beijing - spot API daily kline of the just-closed day
    - cron: "37 0 * * *"   # 08:37 Beijing - retry if the first slot was delayed
    - cron: "17 4 * * *"   # 12:17 Beijing - spot archive cross-check
    - cron: "17 10 * * *"  # 18:17 Beijing - futures archive
    - cron: "17 16 * * *"  # 00:17 Beijing - futures archive (late publish)
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

concurrency:
  group: binance-fetch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch and validate
        id: fetch
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then OUT="$RUNNER_TEMP/data"; else OUT=data; fi
          python fetch.py --out "$OUT"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload result (PR dry run)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: fetch-result
          path: ${{ steps.fetch.outputs.out }}

      - name: Commit data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          git commit -m "data: binance daily klines $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

      - name: Fail on validation errors
        if: steps.fetch.outputs.code != '0'
        run: |
          echo "fetch.py exited with ${{ steps.fetch.outputs.code }}; see _run.json issues/errors"
          exit 1
